    <meta charset="UTF-8" />

    <title>دعوت‌نامه جشن پیوند حمید و فاطمه — شنبه ۲۱ شهریور ۱۴۰۵</title>
    <meta name="description" content="کارت دعوت دیجیتال جشن پیوند آسمانی حمید و فاطمه در باغ تالار یاسین قم" />
    <meta name="theme-color" content="#FAF8F2" />
    
    <!-- Google Fonts: Luxury Persian & English Script Wedding Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel+Decorative:wght@400;700&family=Great+Vibes&family=Parisienne&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Vazirmatn:wght@300;400;500;600;700;800&family=Aref+Ruqaa:wght@400;700&family=Katibeh&display=swap" rel="stylesheet">

    <!-- Single Page Apps for GitHub Pages restore script -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body class="bg-ivory font-sans antialiased selection:bg-rose-gold/30 selection:text-mahogany overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
